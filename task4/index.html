<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple To-Do Toggle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    <h1 id="heading">Simple To-Do Toggle</h1>
    <div id="Counter">Completion Counter: 0/5</div>
   <div class="progress">
        <div id="progress-bar"></div>
   </div>
    <div id="to-dolist">
        <h2 id="SubHeading">To-Do List</h2>
        <ul id="list">
            <li data-index="0">Buy groceries</li>
            <li data-index="1">Walk the dog</li>
            <li data-index="2">Study</li>
            <li data-index="3">Clean Room</li>
            <li data-index="4">Shopping</li>
        </ul>
    <div id="btncontainer">
    <button class="button" id="selectall">Select all</button>
    <button class="button" id="unselectall">Unselect all</button>
    </div>
    
   
    <script src="script.js"></script>
</body>
</html>
