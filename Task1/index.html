<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colour Box Clicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game">
        <h1 id="Name">Colour Box clicker</h1>
        <div class="clicks">
            <h2 id="counting">Total clicks : 0</h2>
        </div>
        <div class="container">
            <div class="box" id="box1" data-index="0" style="background-color:red;">Box1</div>
            
            <div class="box" id="box2" data-index="1" style="background-color:blue;">Box2</div>
            
            <div class="box" id="box3" data-index="2" style="background-color:green;">Box3</div>
           
        </div>
        <div class="currentColor">
            <h1 class="colorName" id="C1">Red</h1>
            <h1 class="colorName" id="C2">Blue</h1>
            <h1 class="colorName" id="C3">Green</h1>
            
        </div>
        <div class="resetor">
        <button id="reset">Reset</button>
        </div>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
