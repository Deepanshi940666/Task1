<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Input Display</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="heading">Text Input Display</h1>

  <div class="text">
    
    <div class="row">
        <textarea id="userText" placeholder="Write something here..."></textarea> <!--textarea is A big text box where the user can write many lines.-->
        <button class="copybtn">Copy</button>
    </div>

    <div class="row">
        <div id="upperCase">Upper Case...</div>
        <button class="copybtn">Copy</button>
    </div>

    <div class="row">
        <div id="LowerCase">Lower Case...</div>
        <button class="copybtn">Copy</button>
    </div>

        <button id="reset">Reset</button>
</div>
<script src="script.js"></script>
</body>
</html>
